<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>曼荼羅オラクルカード 3枚引きリーディング</title>

  <!-- Tailwind CSS (スタイリング用) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel (ブラウザ内でJSXをコンパイルするため) -->
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

  <style>
    /* ベースの背景スタイル（宇宙的な深みを表現） */
    body {
      background: radial-gradient(circle at center top, #1e1b4b 0%, #0f172a 100%);
      color: #f8fafc;
      min-height: 100vh;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    }

    /* カードのフリップ（裏返る）アニメーション用のCSS */
    .card-container {
      perspective: 1000px;
    }
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d;
    }
    .card-container.is-flipped .card-inner {
      transform: rotateY(180deg);
    }
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 0.5rem;
      overflow: hidden;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -2px rgba(0, 0, 0, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.1);
    }
    .card-front {
      transform: rotateY(180deg); /* 表面（絵柄）は180度回転した状態でおく */
      background-color: #1e1b4b;
    }
    .card-back {
      background-color: #312e81; /* 裏面（共通柄） */
    }

    /* 画像の選択・保存・ドラッグを抑止 */
    img {
      -webkit-user-drag: none; /* ドラッグ禁止（Safari/Chrome） */
      user-drag: none; /* ドラッグ禁止 */
      -webkit-touch-callout: none; /* スマホの長押しメニュー禁止（iOS） */
      pointer-events: none; /* 画像単体へのタッチやクリックイベントを無効化（親要素で判定させる） */
      user-select: none; /* 選択禁止 */
      -moz-user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // 右クリック（コンテキストメニュー）を禁止する
    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
    });

    const { useState, useEffect } = React;

    // 画像が読み込めなかった場合のフォールバック処理
    const handleImgError = (e, fallbackText) => {
      if (e.target.dataset.error) return; // 無限ループ防止
      e.target.dataset.error = true;
      e.target.src = `https://placehold.co/178x254/2e1065/fcd34d?text=${encodeURIComponent(fallbackText)}`;
    };

    // 7枚の曼荼羅オラクルカードのデータ定義
    const CARD_DATA = [
      { 
        id: 1, image: '1_s.jpg', name: '進', keywords: '未来 チャンスを掴む', 
        past: '燃えるような情熱で走り続けてきた時期でした。止まることを知らず、自分を駆り立て、チャンスを掴もうと懸命に行動してきた軌跡が見えます。', 
        present: '現在、あなたは新たなチャンスを目の前にしています。過去の情熱を思い出し、未来へ向かって前向きに進んでいくべき大切なタイミングです。', 
        future: '情熱的な行動の先に、大きなチャンスを掴む未来が待っています。あなたの活力が運命を切り開き、素晴らしい展開をもたらすでしょう。' 
      },
      { 
        id: 10, image: '10_s.jpg', name: '魂', keywords: '本気 成長する', 
        past: '魂からの深い喜びに触れ、本気で成長しようと決意した出来事がありました。何かに対して真剣に向き合い、自分を磨いてきた過去があります。', 
        present: '現在、あなたは魂レベルで本気で成長するタイミングを迎えています。心の奥底からの喜びに繋がり、ワクワクする気持ちに素直に従ってみてください。', 
        future: '本気の取り組みが実を結び、魂が望む大きな成長を遂げる未来が訪れます。喜びに満ちた、創造的で豊かな人生が展開していくでしょう。' 
      },
      { 
        id: 11, image: '11_s.jpg', name: '光', keywords: '向上 まっすぐに', 
        past: '暗闇の中に希望の光を見出し、まっすぐに向上しようと努めてきました。不安や迷いを乗り越え、光の差す方へ向かおうとした強さがあります。', 
        present: '現在、あなたの中に確かな希望の光が差し込んでいます。ご自身の可能性に自信を持ち、まっすぐに成長していくエネルギーに満ち溢れています。', 
        future: '希望の光に全身が包まれ、あなたの才能や可能性がまっすぐに伸びていく未来が待っています。すべてがクリアになり、明るく輝かしい展開が訪れるでしょう。' 
      },
      { 
        id: 18, image: '18_s.jpg', name: '新', keywords: '挑戦 ここから始める', 
        past: '心に平和を取り戻し、新たな挑戦に向けてじっくりと準備を整えてきた時期がありました。癒やしのプロセスを経て、新しいスタートラインに立っていたようです。', 
        present: '現在まさに、ここから新しい挑戦を始める時が来ています。十分な安心感と準備が整っています。勇気を出して新たな一歩を踏み出してください。', 
        future: '新たな挑戦の先には、深い安定と癒やしがもたらされる未来があります。自然体で新しい世界へと進み、自分らしい居場所を築くことができるでしょう。' 
      },
      { 
        id: 22, image: '22_s.jpg', name: '和', keywords: '変化 流れにまかせる', 
        past: '静かな内省の時期を過ごし、大きな変化の流れに身を任せてきた経験があります。感情の波に逆らわず、静かに受け止めることで乗り越えてきました。', 
        present: '現在、物事を無理にコントロールしようとせず、変化の流れにまかせることが最も大切です。心の中に静けさと調和（和）を保つことを意識してください。', 
        future: '変化の流れに身を委ねることで、やがてすべてが美しく調和する未来へと導かれます。大いなる存在への深い信頼と、静かな安心感に包まれるでしょう。' 
      },
      { 
        id: 26, image: '26_s.jpg', name: '信', keywords: '継続 ゆっくりと', 
        past: '深い内省の時間を持ち、すぐには結果が見えなくても、自分や目に見えないものを信じてゆっくりと継続してきた時期がありました。', 
        present: '現在は結果を急ぐ時ではありません。ご自身を信じて、ゆっくりと歩みを継続する時です。焦りを手放し、自分のペースを守り抜いてください。', 
        future: '信じて継続してきたことが、ゆっくりと、しかし確実で強固な形となる未来がやってきます。周囲への深い理解と共に、静かで大きな達成感が訪れるでしょう。' 
      },
      { 
        id: 32, image: '32_s.jpg', name: '咲', keywords: '自然 許可する', 
        past: '深い魂の変容を経験し、ありのままの自分自身に許可を出すための、葛藤と浄化の時期を過ごしてきました。', 
        present: '現在、自然体でありのままの自分に、完全に許可を出す時です。自分を縛っていた制限を手放すことで、魂が花開くための準備が整います。', 
        future: 'これまでの学びや経験が見事に統合され、あなたという唯一無二の花が自然に咲き誇る未来が訪れます。魂の変容が完了し、奇跡のような美しい展開を迎えるでしょう。' 
      },
    ];

    // 配列から指定された数の要素をランダムに抽出するヘルパー関数
    function getRandomCards(cardsArray, count) {
      const shuffled = [...cardsArray].sort(() => 0.5 - Math.random());
      return shuffled.slice(0, count);
    }

    function TitleScreen({ onStart }) {
      return (
        <div className="flex flex-col items-center justify-center min-h-[80vh] px-4 text-center">
          <h1 className="text-4xl md:text-5xl font-bold mb-6 text-transparent bg-clip-text bg-gradient-to-r from-amber-200 to-yellow-500">
            曼荼羅オラクルカード<br/><span className="text-3xl md:text-4xl mt-2 block">3枚引きリーディング</span>
          </h1>
          <p className="text-lg md:text-xl mb-12 text-indigo-200 max-w-2xl leading-relaxed">
            過去・現在・未来を繋ぐ時間の物語を紐解きます。<br/>
            心を整え、直感に従ってカードを選んでください。
          </p>
          <button 
            onClick={onStart}
            className="px-8 py-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white text-xl font-bold rounded-full shadow-[0_0_15px_rgba(139,92,246,0.5)] transition-all transform hover:scale-105"
          >
            リーディングを始める
          </button>
        </div>
      );
    }

    function CardSelectScreen({ stepName, stepDesc, cards, onSelect }) {
      const [revealedCardId, setRevealedCardId] = useState(null);

      const handleCardClick = (id) => {
        // まだカードが選ばれていない場合のみ選択可能
        if (revealedCardId === null) {
          setRevealedCardId(id);
        }
      };

      const handleNext = () => {
        const selectedCard = cards.find(c => c.id === revealedCardId);
        onSelect(selectedCard);
        setRevealedCardId(null); // 状態リセット
      };

      return (
        <div className="flex flex-col items-center min-h-[80vh] py-12 px-4">
          <div className="text-center mb-10">
            <h2 className="text-3xl font-bold mb-4 text-amber-300">{stepName}</h2>
            <p className="text-indigo-200 max-w-lg mx-auto">{stepDesc}</p>
          </div>
          
          <div className="flex justify-center gap-6 md:gap-12 mb-16 flex-wrap">
            {cards.map(card => {
              const isFlipped = revealedCardId === card.id;
              const isNotSelected = revealedCardId !== null && revealedCardId !== card.id;
              
              return (
                <div 
                  key={card.id}
                  className={`card-container cursor-pointer transition-opacity duration-500 ${isNotSelected ? 'opacity-40 grayscale' : 'hover:scale-105'}`}
                  style={{ width: '120px', aspectRatio: '89/127' }} // 127mm x 89mm の比率
                  onClick={() => handleCardClick(card.id)}
                >
                  <div className={`card-inner ${isFlipped ? 'is-flipped' : ''}`}>
                    <div className="card-face card-front border-2 border-amber-400">
                      <img 
                        src={card.image} 
                        alt={card.name} 
                        className="w-full h-full object-cover" 
                        onError={(e) => handleImgError(e, card.name)}
                      />
                    </div>
                    <div className="card-face card-back border-2 border-indigo-500/50 hover:border-amber-400/80 transition-colors">
                      <img 
                        src="uramen.png" 
                        alt="裏面" 
                        className="w-full h-full object-cover" 
                        onError={(e) => handleImgError(e, '裏面')}
                      />
                    </div>
                  </div>
                </div>
              );
            })}
          </div>

          <div className="h-20 flex items-center justify-center w-full">
            {revealedCardId !== null && (
              <button 
                onClick={handleNext}
                className="px-10 py-3 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-full shadow-lg transition-transform transform hover:scale-105 animate-bounce"
              >
                決定して次へ
              </button>
            )}
          </div>
        </div>
      );
    }

    function ResultScreen({ results, onRestart }) {
      return (
        <div className="max-w-5xl mx-auto px-4 py-12">
          <div className="text-center mb-12">
            <h2 className="text-3xl md:text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 to-yellow-500 tracking-widest mb-4">
              リーディング結果
            </h2>
            <p className="text-indigo-200">過去・現在・未来を繋ぐ時間の物語</p>
          </div>
          
          <div className="grid grid-cols-1 md:grid-cols-3 gap-8 mb-16">
            {/* 過去 */}
            <div className="flex flex-col items-center bg-indigo-900/40 p-6 rounded-2xl border border-indigo-700/50 shadow-xl relative mt-4 md:mt-0">
              <div className="absolute -top-4 bg-indigo-800 text-indigo-100 px-4 py-1 rounded-full text-sm font-bold border border-indigo-500">過去</div>
              <div className="w-32 rounded overflow-hidden shadow-lg mb-6 border border-indigo-500/30" style={{ aspectRatio: '89/127' }}>
                <img src={results.past.image} className="w-full h-full object-cover" onError={(e) => handleImgError(e, results.past.name)} />
              </div>
              <h4 className="font-bold text-2xl mb-1 text-amber-100">{results.past.name}</h4>
              <p className="text-sm font-semibold text-indigo-300 mb-2">{results.past.keywords}</p>
            </div>
            
            {/* 現在 */}
            <div className="flex flex-col items-center bg-amber-900/20 p-6 rounded-2xl border border-amber-600/50 transform md:scale-105 shadow-2xl relative z-10">
              <div className="absolute -top-4 bg-amber-700 text-amber-50 px-6 py-1 rounded-full text-sm font-bold border border-amber-400">現在</div>
              <div className="w-40 rounded overflow-hidden shadow-xl mb-6 border border-amber-400/50" style={{ aspectRatio: '89/127' }}>
                <img src={results.present.image} className="w-full h-full object-cover" onError={(e) => handleImgError(e, results.present.name)} />
              </div>
              <h4 className="font-bold text-2xl mb-1 text-amber-300">{results.present.name}</h4>
              <p className="text-sm font-semibold text-amber-200 mb-2">{results.present.keywords}</p>
            </div>
            
            {/* 未来 */}
            <div className="flex flex-col items-center bg-purple-900/40 p-6 rounded-2xl border border-purple-700/50 shadow-xl relative mt-4 md:mt-0">
              <div className="absolute -top-4 bg-purple-800 text-purple-100 px-4 py-1 rounded-full text-sm font-bold border border-purple-500">未来</div>
              <div className="w-32 rounded overflow-hidden shadow-lg mb-6 border border-purple-500/30" style={{ aspectRatio: '89/127' }}>
                <img src={results.future.image} className="w-full h-full object-cover" onError={(e) => handleImgError(e, results.future.name)} />
              </div>
              <h4 className="font-bold text-2xl mb-1 text-amber-100">{results.future.name}</h4>
              <p className="text-sm font-semibold text-purple-300 mb-2">{results.future.keywords}</p>
            </div>
          </div>

          <div className="bg-slate-800/60 p-8 rounded-2xl mb-12 border border-slate-600 shadow-inner">
            <h3 className="text-xl font-bold mb-6 text-center text-amber-200 flex items-center justify-center gap-2">
              <span>✧</span> 統合メッセージ <span>✧</span>
            </h3>
            <div className="leading-loose text-slate-200 text-left max-w-3xl mx-auto space-y-6 text-lg">
              <p>{results.past.past}</p>
              <p>{results.present.present}</p>
              <p>{results.future.future}</p>
            </div>
          </div>

          <div className="text-center pb-12">
            <button 
              onClick={onRestart} 
              className="px-8 py-3 bg-slate-700 hover:bg-slate-600 text-white font-bold rounded-full shadow-lg transition-all transform hover:scale-105 border border-slate-500"
            >
              もう一度リーディングする
            </button>
          </div>
        </div>
      );
    }

    function App() {
      // 状態管理: 'title', 'future_select', 'present_select', 'past_select', 'result'
      const [gameState, setGameState] = useState('title');
      const [availableCards, setAvailableCards] = useState([]);
      const [displayCards, setDisplayCards] = useState([]);
      const [results, setResults] = useState({ past: null, present: null, future: null });

      // リーディング開始
      const handleStart = () => {
        // 画像拡張子を.pngに変更したデータを作成
        const updatedCardData = CARD_DATA.map(card => ({
          ...card,
          image: card.image.replace('.jpg', '.png')
        }));
        
        const initialCards = [...updatedCardData];
        setAvailableCards(initialCards);
        setDisplayCards(getRandomCards(initialCards, 3));
        setResults({ past: null, present: null, future: null });
        // 未来から選択を開始する
        setGameState('future_select');
      };

      // 未来のカード選択完了時
      const handleFutureSelected = (selectedCard) => {
        setResults(prev => ({ ...prev, future: selectedCard }));
        const nextCards = availableCards.filter(c => c.id !== selectedCard.id);
        setAvailableCards(nextCards);
        setDisplayCards(getRandomCards(nextCards, 3));
        setGameState('present_select');
      };

      // 現在のカード選択完了時
      const handlePresentSelected = (selectedCard) => {
        setResults(prev => ({ ...prev, present: selectedCard }));
        const nextCards = availableCards.filter(c => c.id !== selectedCard.id);
        setAvailableCards(nextCards);
        setDisplayCards(getRandomCards(nextCards, 3));
        setGameState('past_select');
      };

      // 過去のカード選択完了時
      const handlePastSelected = (selectedCard) => {
        setResults(prev => ({ ...prev, past: selectedCard }));
        setGameState('result');
      };

      // 画面のレンダリング切り替え
      let content = null;
      switch (gameState) {
        case 'title':
          content = <TitleScreen onStart={handleStart} />;
          break;
        case 'future_select':
          content = (
            <CardSelectScreen 
              stepName="【ステップ 1/3】 未来からの呼びかけ"
              stepDesc="何があなたを呼んでいるのか、この流れが導く可能性を表します。直感で1枚選んでください。"
              cards={displayCards}
              onSelect={handleFutureSelected}
            />
          );
          break;
        case 'present_select':
          content = (
            <CardSelectScreen 
              stepName="【ステップ 2/3】 現在の応答"
              stepDesc="未来の呼びかけに対して、今ここでどう応答しているかを表します。残りの中から直感で1枚選んでください。"
              cards={displayCards}
              onSelect={handlePresentSelected}
            />
          );
          break;
        case 'past_select':
          content = (
            <CardSelectScreen 
              stepName="【ステップ 3/3】 過去の意味づけ"
              stepDesc="未来の可能性に照らし合わせて、過去の経験が持つ本当の意味を表します。最後の一枚を直感で選んでください。"
              cards={displayCards}
              onSelect={handlePastSelected}
            />
          );
          break;
        case 'result':
          content = <ResultScreen results={results} onRestart={() => setGameState('title')} />;
          break;
        default:
          content = <TitleScreen onStart={handleStart} />;
      }

      return (
        <div className="w-full">
          {/* ヘッダー部分は任意ですが、シンプルにしています */}
          <div className="absolute top-0 left-0 w-full p-4 flex justify-between items-center opacity-50 pointer-events-none">
            <div className="text-xs tracking-widest text-indigo-300">MANDALA ORACLE</div>
          </div>
          
          <main className="container mx-auto">
            {content}
          </main>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
